# Інтервал появи нового NPC (в секундах)
spawn-interval-seconds: 300

# Максимальна кількість одночасно активних NPC на сервері
max-active-npcs: 2

# Радіус (в блоках) навколо гравця, де може з'явитись NPC
spawn-radius-min: 15
spawn-radius-max: 20

# Якщо true - NPC намагається заспавнитись у печері під землею (в кишені повітря зі
# стелею з каменю над головою). Якщо підходящу печеру не знайдено за спроби, або
# значення false - плагін як і раніше шукає місце на поверхні (старий алгоритм).
spawn-in-caves: true
# Діапазон висоти (Y), в якому шукається печера для спавну
cave-min-y: -40
cave-max-y: 45

# Радіус пошуку руди для видобутку (в блоках навколо NPC)
ore-search-radius: 6
# Час (в тіках, 20 = 1 сек) на видобуток одного блоку руди
ore-mining-duration-ticks: 70

# Радіус пошуку дерев для видобутку
tree-search-radius: 5

# Радіус пошуку мирних мобів для атаки
mob-search-radius: 6

# Дистанція (в блоках) до гравця, при якій NPC зникає з димом
despawn-distance: 8.0

# Час (в тіках, 20 = 1 сек) на "видобуток" одного блоку дерева
mining-duration-ticks: 40

# Скільки ударів потрібно щоб вбити мирного моба
hits-to-kill-mob: 3

# Час життя NPC у секундах, якщо він нічого не робить (0 = безкінечно)
max-lifetime-seconds: 900

# Голосова механіка (потребує встановленого на сервері Simple Voice Chat)
voice:
  # Головний перемикач - вимкни, якщо не хочеш захоплювати голос гравців взагалі
  enabled: true
  # Скільки секунд голосу гравця тримати в буфері про запас.
  # Має бути помітно більше за voice.clip-max-seconds, інакше нема з чого обирати
  # найбільш "голосну" ділянку.
  buffer-seconds: 12
  # Мінімальна і максимальна тривалість (в секундах) відрізка, який буде відтворено.
  # Кожен раз обирається випадкове значення в цьому діапазоні.
  clip-min-seconds: 5
  clip-max-seconds: 8
  # Поріг RMS-гучності (0-32767), нижче якого 20-мс кадр вважається тишею/шумом мікрофона.
  # Плагін шукає в буфері відрізок потрібної довжини з найбільшою часткою "голосних"
  # кадрів вище цього порогу - і НЕ відтворить кліп, якщо гравець весь цей час мовчав.
  silence-rms-threshold: 300
  # Шанс (0.0 - 1.0), що КОНКРЕТНИЙ NPC взагалі буде "балакучим" - визначається один раз
  # при спавні. Якщо не пощастило - цей NPC ніколи не запам'ятовує і не програє голос
  # (просто звичайний NPC), щоб не кожен спавн бубонів голосами гравців.
  scare-chance: 0.90
  # Раз у скільки секунд "балакучий" NPC намагається запам'ятати нову репліку голосу
  # гравця, чий скін він носить (бере голосний відрізок з буфера - див. clip-min/max-seconds
  # і silence-rms-threshold вище). Якщо гравець мовчав - просто спробує ще раз наступного разу.
  memorize-interval-seconds: 6
  # Максимальна кількість одночасно запам'ятованих реплік на одного NPC.
  # Коли ліміт досягнуто, найстаріша репліка витісняється новою.
  memorize-max-lines: 6
  # Проміжок (в секундах, випадково обирається в цьому діапазоні) МІЖ відтвореннями
  # реплік - тобто через скільки секунд після завершення однієї репліки почне грати наступна.
  playback-gap-min-seconds: 2
  playback-gap-max-seconds: 3
  # Головний перемикач постійного архіву: чи зберігати деякі відтворені кліпи НАЗАВЖДИ
  # у файли plugins/RandomNPCs/voicelines/*.wav (доки їх не видалить /randomnpc clearvoicelines)
  archive-enabled: true
  # Шанс (0.0 - 1.0), що конкретний відтворений кліп додатково збережеться назавжди на диск.
  # Не плутати зі scare-chance вище - це другий, незалежний "кидок кубика"
  # ЛИШЕ для тих кліпів, які й так були відтворені гравцям.
  archive-chance: 0.90
  # Детальні логи в консоль на кожному кроці (init SVC, трекінг, пакети мікрофона,
  # спроба відтворення) - вимкни, коли переконаєшся що все працює, бо логу буде багато
  debug: true
  # Радіус чутності (в блоках) відтвореного голосу NPC. Постав більше для тестування,
  # якщо підозрюєш, що гравець просто був задалеко в момент відтворення
  playback-distance: 24.0